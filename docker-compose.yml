services:
  backend:
    build:
      context: ./backend
    command: sh -c "alembic upgrade head && python -m app.scripts.seed_mock_data && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      POORTOPOUR_ENVIRONMENT: local
      POORTOPOUR_PROVIDER: mock
      POORTOPOUR_DATABASE_URL: postgresql+psycopg://poortopour:poortopour@db:5432/poortopour
      POORTOPOUR_ALPHA_VANTAGE_API_KEY: ${POORTOPOUR_ALPHA_VANTAGE_API_KEY:-}
      POORTOPOUR_ALPHA_VANTAGE_DAILY_FUNCTION: ${POORTOPOUR_ALPHA_VANTAGE_DAILY_FUNCTION:-TIME_SERIES_DAILY}
      POORTOPOUR_SCANNER_RISK_REWARD_ATR_BUFFER_MULTIPLIER: ${POORTOPOUR_SCANNER_RISK_REWARD_ATR_BUFFER_MULTIPLIER:-0.5}
      POORTOPOUR_SCANNER_RISK_REWARD_TARGET_MULTIPLE: ${POORTOPOUR_SCANNER_RISK_REWARD_TARGET_MULTIPLE:-2.0}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: poortopour
      POSTGRES_USER: poortopour
      POSTGRES_PASSWORD: poortopour
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poortopour -d poortopour"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  frontend_node_modules:
  postgres_data:
